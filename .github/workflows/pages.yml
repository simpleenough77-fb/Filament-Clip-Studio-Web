# Tests every push and pull request; deploys main to Cloudflare (filamentclip.com) and GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pillow
      - name: Catalog, CSV import and build checks
        run: python tests/test_quick.py
      - name: Paste import checks
        run: node tests/test_paste.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate catalog feed, source hashes and build stamp
        run: python tools/build_site.py --stamp
      - name: Stage site
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_pages' --exclude 'tests' --exclude 'tools' --exclude 'wrangler.jsonc' ./ _site/
      # Primary host: Cloudflare Workers static assets (filamentclip.com).
      # Enabled once the repo variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN exist.
      - name: Deploy to Cloudflare
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4.138.0'
      # GitHub Pages: the full site until PRIMARY_HOST is set, then a redirect to it
      # (keeping downloads/catalog.csv for older copies of the Google Sheets builder).
      - name: Stage GitHub Pages redirect
        if: vars.PRIMARY_HOST != ''
        run: python tools/build_site.py --redirect-stub _pages "${{ vars.PRIMARY_HOST }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.PRIMARY_HOST != '' && '_pages' || '_site' }}
      - id: deployment
        uses: actions/deploy-pages@v4
