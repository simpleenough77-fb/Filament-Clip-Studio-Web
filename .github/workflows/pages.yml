# Tests every push and pull request; deploys main to Cloudflare (filamentclip.com) and GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pip install pillow
      - name: Catalog, CSV import and build checks
        run: python tests/test_quick.py
      - name: Catalog refresh tool checks
        run: python tests/test_refresh.py
      - name: Paste import checks
        run: node tests/test_paste.mjs
      - name: Usage worker checks
        run: node tests/test_stat.mjs
      - name: Feedback worker and form checks
        run: node tests/test_feedback.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate catalog feed, source hashes and build stamp
        run: python tools/build_site.py --stamp
      - name: Stage site
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_pages' --exclude 'tests' --exclude 'tools' --exclude 'worker' --exclude 'wrangler.jsonc' ./ _site/
      # Primary host: Cloudflare Workers static assets (filamentclip.com).
      # Enabled once the repo variable CLOUDFLARE_ACCOUNT_ID and secret CLOUDFLARE_API_TOKEN exist.
      - name: Deploy to Cloudflare
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4.165.0'
      # GitHub Pages: the full site until PRIMARY_HOST is set, then a redirect to it
      # (keeping downloads/catalog.csv for older copies of the Google Sheets builder).
      - name: Stage GitHub Pages redirect
        if: vars.PRIMARY_HOST != ''
        run: python tools/build_site.py --redirect-stub _pages "${{ vars.PRIMARY_HOST }}"
      # One artifact name per run attempt: deploy-pages refuses to pick between
      # same-named artifacts, which broke "Re-run failed jobs".
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ vars.PRIMARY_HOST != '' && '_pages' || '_site' }}
          include-hidden-files: true

  # Separate job (GitHub's own template layout): the upload is visible to the
  # artifact API by the time this starts, avoiding the "No artifacts found" race.
  pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
